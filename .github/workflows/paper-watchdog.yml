name: Log Gabriel workflow watchdog
on:
  push:
    branches: [main]
    paths: ['watchdog/start.signal']
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: log-gabriel-workflow-supervisor
  cancel-in-progress: true
jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Check recovery decisions
        run: python -m unittest discover -s watchdog -p 'test_supervisor.py' -v
      - name: Supervise current Log Gabriel workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: python watchdog/supervisor.py
